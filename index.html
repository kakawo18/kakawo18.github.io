  <h1>youtube-uploader</h1>
  <p class="lead">個人の YouTube チャンネルで、解説動画の投稿作業を自動化するための個人用ツールです。</p>

  <h2>このツールについて</h2>
  <p>運営者が自分で制作した解説動画を、運営者自身の YouTube チャンネルへ投稿するために使っています。
     投稿には YouTube Data API を利用し、運営者本人の Google アカウントでのみ認可しています。
     一般の方が利用するサービスではなく、第三者のアカウントやデータは扱いません。</p>
